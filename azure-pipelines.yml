trigger:
  branches:
    include:
      - master

parameters:
  - name: targetSlot
    displayName: Target deployment slot (API)
    type: string
    default: rc
    values:
      - rc
      - production

variables:
  dockerRegistryServiceConnection: 'acr-connection'   # ACR service connection (create in Project Settings)
  containerRegistry: 'Deployment.azurecr.io'
  azureSubscription: 'arm-connection'                 # ARM service connection, reusing the deployment-portal SP
  resourceGroup: 'test'
  apiAppName: 'deploy'                                 # your existing App Service
  uiAppName: 'deploy'          # create this one - name must be globally unique
  tag: '$(Build.BuildId)'

stages:

- stage: BuildAPI
  displayName: Build DeploymentAPI image
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build and push deployment-api image
      inputs:
        command: buildAndPush
        repository: 'deployment-api'
        dockerfile: 'src/DeploymentAPI/Dockerfile'
        buildContext: 'src/DeploymentAPI'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: BuildUI
  displayName: Build deployment-ui image
  jobs:
  - job: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build and push deployment-ui image
      inputs:
        command: buildAndPush
        repository: 'deployment-ui'
        dockerfile: 'deployment-ui/Dockerfile'
        buildContext: 'deployment-ui'
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

- stage: DeployAPI
  displayName: Deploy DeploymentAPI
  dependsOn: BuildAPI
  jobs:
  - deployment: Deploy
    pool:
      vmImage: ubuntu-latest
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy API to App Service slot
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(apiAppName)
              resourceGroupName: $(resourceGroup)
              deployToSlotOrASE: true
              slotName: ${{ parameters.targetSlot }}
              containers: $(containerRegistry)/deployment-api:$(tag)

- stage: DeployUI
  displayName: Deploy deployment-ui
  dependsOn: BuildUI
  jobs:
  - deployment: Deploy
    pool:
      vmImage: ubuntu-latest
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: Deploy UI to App Service
            inputs:
              azureSubscription: $(azureSubscription)
              appName: $(uiAppName)
              resourceGroupName: $(resourceGroup)
              containers: $(containerRegistry)/deployment-ui:$(tag)
